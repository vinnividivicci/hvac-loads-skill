[project]
name = "hvac-loads-skill"
version = "0.1.0"
description = "Development harness (tests) for the hvac-load-calc Claude Code skill"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "shapely>=2.0",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pillow>=10",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engines: needs OpenStudio/EnergyPlus/OpenStudio-HPXML installed (hvacload.py setup)"]

[tool.uv]
package = false
